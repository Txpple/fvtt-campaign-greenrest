<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Broken Heart of Greenrest</title>
<style>
  :root{
    --paper:#fbf7ef; --ink:#2a2420; --ink-soft:#5a4f46; --rule:#c9b99b; --accent:#7a2a2a; --accent-soft:#a8514a;
    --green:#4f6b3a; --caption:#6b5f55;
  }
  @page { size: A4; margin: 22mm 20mm 24mm 20mm;
    @bottom-center { content: counter(page); font-family: Georgia, "Palatino Linotype", serif; font-size: 10pt; color: #6b5f55; } }
  @page :first { @bottom-center { content: none; } }
  html,body{background:var(--paper);color:var(--ink);margin:0;padding:0}
  body{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-size:11.5pt;line-height:1.55;}
  .page{max-width:760px;margin:0 auto;padding:32px 24px 60px}
  @media print{ .page{max-width:none;padding:0} }
  h1,h2,h3,h4{font-family:Georgia,"Palatino Linotype",serif;font-weight:normal;color:var(--ink);margin:0}
  h1{font-size:34pt;letter-spacing:.02em;line-height:1.1}
  h2{font-size:22pt;margin-top:2.2em;margin-bottom:.35em;break-after:avoid;page-break-after:avoid}
  h2 .kicker{display:block;font-size:10.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:.45em}
  h3{font-size:14.5pt;margin-top:1.6em;margin-bottom:.3em;color:var(--accent);break-after:avoid;page-break-after:avoid}
  p{margin:0 0 .85em;text-align:justify;hyphens:auto;break-inside:avoid;page-break-inside:avoid}
  p.first::first-letter{font-family:Georgia,serif;font-size:3.1em;float:left;line-height:.85;padding:.06em .08em 0 0;color:var(--accent)}
  p.lead{font-style:italic;color:var(--ink-soft);text-align:left}
  blockquote{margin:.9em 1.6em 1.1em;padding-left:.9em;border-left:3px solid var(--rule);color:var(--ink-soft);font-style:italic;break-inside:avoid;page-break-inside:avoid}
  blockquote p{text-align:left}
  .aside{margin:1.1em 0 1.2em;padding:.8em 1.1em;background:#f1ebdd;border:1px solid var(--rule);border-radius:4px;font-size:10.6pt;color:var(--ink-soft);break-inside:avoid;page-break-inside:avoid}
  .aside .t{display:block;font-family:Georgia,serif;font-size:9.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.35em}
  .aside p{text-align:left;margin-bottom:.5em}
  .aside p:last-child{margin-bottom:0}
  figure{margin:1.2em 0 1.4em;break-inside:avoid;page-break-inside:avoid}
  figure img{width:100%;height:auto;display:block;border-radius:3px}
  figcaption{font-size:10pt;color:var(--caption);font-style:italic;text-align:center;margin-top:.45em}
  h2 + figure{margin-top:.6em}
  .titlepage{text-align:center;padding-top:40px;break-after:page;page-break-after:always}
  .titlepage .over{font-size:11pt;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2em}
  .titlepage h1{margin:.2em 0 .3em}
  .titlepage .sub{font-style:italic;font-size:14pt;color:var(--ink-soft);margin-bottom:2.2em}
  .titlepage .epigraph{max-width:440px;margin:0 auto 2em;font-style:italic;color:var(--ink-soft);font-size:11.5pt}
  .titlepage .who{font-size:10.5pt;color:var(--ink-soft);letter-spacing:.05em;margin-top:2.5em}
  .titlepage figure{margin:0 0 1.6em}
  .part{text-align:center;padding-top:120px;break-before:page;page-break-before:always;break-after:page;page-break-after:always}
  .part .n{font-size:11pt;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);margin-bottom:1em}
  .part h1{font-size:30pt}
  .part .sub{font-style:italic;color:var(--ink-soft);margin-top:1em;font-size:12.5pt}
  .chapter{break-before:page;page-break-before:always}
  .rule{border:0;border-top:1px solid var(--rule);margin:1.8em auto;width:40%}
  .rule.double{border-top:3px double var(--rule);width:100%}
  .personae{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin:1em 0}
  .persona{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;break-inside:avoid;page-break-inside:avoid}
  .persona img{width:120px;height:150px;object-fit:cover;object-position:top;border-radius:3px}
  .persona h4{font-size:12.5pt;color:var(--accent);margin-bottom:.2em}
  .persona p{font-size:10.4pt;text-align:left;margin-bottom:.4em;line-height:1.45}
  .cast p{text-align:left;margin-bottom:.5em;font-size:10.8pt}
  .cast b{color:var(--accent)}
  .hearts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:1em 0 1.4em;break-inside:avoid;page-break-inside:avoid}
  .hearts div{text-align:center;font-size:9.8pt;color:var(--ink-soft)}
  .hearts img{width:100%;border-radius:4px;margin-bottom:.3em}
  .hearts b{display:block;color:var(--ink);font-size:10.5pt}
  .bestiary .entry{display:grid;grid-template-columns:200px 1fr;gap:16px;margin:1.2em 0;padding-bottom:1.1em;border-bottom:1px solid var(--rule);break-inside:avoid;page-break-inside:avoid}
  .bestiary .entry img{width:200px;border-radius:3px;margin-bottom:6px}
  .bestiary .entry h3{margin-top:0}
  .bestiary .entry p{font-size:10.3pt;line-height:1.45;text-align:left}
  .bestiary .met{font-size:9.6pt;color:var(--accent);letter-spacing:.04em;margin-bottom:.4em}
  .bestiary blockquote{font-size:10pt;margin:.4em 0 .7em .6em}
  .bestiary .entry.wide{grid-template-columns:1fr}
  .bestiary .entry.wide img{width:100%;max-width:520px}
  .toc{columns:2;column-gap:32px;font-size:10.8pt}
  .toc p{text-align:left;margin:0 0 .25em;break-inside:avoid}
  .toc .p{margin-top:.7em;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;font-size:9.5pt}
  .small{font-size:10pt;color:var(--ink-soft)}
  em.sp{color:var(--green)}
  @media (max-width:640px){ .personae,.hearts{grid-template-columns:1fr 1fr} .persona{grid-template-columns:90px 1fr} .persona img{width:90px;height:112px} .bestiary .entry{grid-template-columns:1fr} .bestiary .entry img{width:100%;max-width:320px} .toc{columns:1} }
</style>
</head>
<body>
<div class="page">
